  <div class="label">days since conviction and remand</div>

  <p class="note">Counting from 5 November 2026, the day he was convicted and remanded into custody. Sentenced to 10 years and 6 months on 9 November 2026.</p>

  <script>
    const startDate = new Date('2026-11-05T00:00:00Z');
    const messages = [
      "Still here.",
      "I've found God. Again.",
      "The WiFi is terrible.",
      "At least the food is... no.",
      "Days are blending together.",
      "Tell my followers I'm spiritually growing.",
      "This is character building.",
      "I miss the attention.",
      "Meditation is going well.",
      "Any updates from the outside?"
    ];

    function makeTally(n) {
      if (n <= 0) return '';
      let html = '';
      const groups = Math.floor(n / 5);
      const remainder = n % 5;
      for (let i = 0; i < groups; i++) {
        html += '<div class="tally-group">';
        html += '<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>';
        html += '<div class="strike"></div>';
        html += '</div>';
      }
      if (remainder > 0) {
        html += '<div class="tally-group" style="width:' + (remainder * 12 + 8) + 'px">';
        for (let i = 0; i < remainder; i++) {
          html += '<div class="bar" style="left:' + (4 + i * 12) + 'px"></div>';
        }
        html += '</div>';
      }
      return html;
    }

    function updateDays() {
      const now = new Date();
      const days = Math.max(0, Math.floor((now - startDate) / (1000 * 60 * 60 * 24)));
      document.getElementById('days').textContent = days;
      document.getElementById('tally').innerHTML = makeTally(days);
    }
    updateDays();
    setInterval(updateDays, 60000);

    // Speech bubble
    const photoWrap = document.getElementById('photoWrap');
    const bubble = document.getElementById('bubble');
    let bubbleTimeout;
    photoWrap.addEventListener('click', () => {
      const msg = messages[Math.floor(Math.random() * messages.length)];
      bubble.textContent = msg;
      bubble.classList.add('show');
      clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => bubble.classList.remove('show'), 2800);
    });
  </script>
</body>
</html>
